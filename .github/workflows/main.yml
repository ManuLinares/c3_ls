name: CI & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test (All Targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ManuLinares/setup-c3@main
        with:
          version: nightly

      - name: Run Linux Test Suite
        run: c3c test

      - name: Install Toolchains & Wine
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools musl-dev gcc-aarch64-linux-gnu wine

      - name: Get current month
        id: get-date
        run: echo "month=$(/bin/date -u '+%Y-%m')" >> $GITHUB_OUTPUT
        shell: bash

      - name: Cache SDKs
        id: cache-sdks
        uses: actions/cache@v6
        with:
          path: ~/.cache/c3
          key: c3-sdks-${{ runner.os }}-${{ steps.get-date.outputs.month }}
          restore-keys: |
            c3-sdks-${{ runner.os }}-

      - name: Fetch SDKs
        if: steps.cache-sdks.outputs.cache-hit != 'true'
        run: |
          c3c fetch-sdk windows --accept-license
          c3c fetch-sdk macos --accept-license

      - name: Run Windows Test Suite (Wine)
        run: |
          c3c test --target windows-x64 --suppress-run
          wine ./build/testrun.exe

      # 1. Linux x86_64 (musl static & stripped)
      - name: Build Linux x86_64 (Static musl)
        run: |
          MUSL_PATH=$(find /usr/lib -maxdepth 3 -name 'crt1.o' -path '*musl*' | head -1 | xargs dirname)
          c3c build -g0 -O3 --linux-libc=musl --linux-crt "$MUSL_PATH" --linux-crtbegin "$MUSL_PATH" -z "-static" -z "-s"
          mkdir -p dist
          tar -czvf dist/c3_ls-linux-x86_64.tar.gz -C build c3_ls

      # 2. Linux aarch64 (ARM64 Cross-compile)
      - name: Build Linux aarch64
        run: |
          CRTBEGIN_DIR=$(dirname $(aarch64-linux-gnu-gcc -print-file-name=crtbegin.o))
          c3c build --target linux-aarch64 -g0 -O3 --build-dir build-linux-arm64 --output-dir build-linux-arm64 --linux-crt /usr/aarch64-linux-gnu/lib --linux-crtbegin "$CRTBEGIN_DIR" -z "-s"
          tar -czvf dist/c3_ls-linux-aarch64.tar.gz -C build-linux-arm64 c3_ls

      # 3. Windows x86_64 (Cross-compile with static CRT)
      - name: Build Windows x86_64
        run: |
          c3c build --target windows-x64 -g0 -O3 --wincrt=static --build-dir build-win64 --output-dir build-win64
          zip -j dist/c3_ls-windows-x86_64.zip build-win64/c3_ls.exe

      # 4. macOS aarch64 (Apple Silicon)
      - name: Build macOS aarch64
        run: |
          c3c build --target macos-aarch64 -g0 -O3 --build-dir build-mac-arm64 --output-dir build-mac-arm64
          chmod +x build-mac-arm64/c3_ls
          tar -czvf dist/c3_ls-macos-aarch64.tar.gz -C build-mac-arm64 c3_ls

      # 5. macOS x86_64 (Intel)
      - name: Build macOS x86_64
        run: |
          c3c build --target macos-x64 -g0 -O3 --build-dir build-mac-x64 --output-dir build-mac-x64
          chmod +x build-mac-x64/c3_ls
          tar -czvf dist/c3_ls-macos-x86_64.tar.gz -C build-mac-x64 c3_ls

      # 6. Web Playground (WASM)
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v16

      - name: Build Web Playground
        run: c3c build web

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: dist/*

  # Push rolling pre-release on main commits (for c3.nvim auto-installers)
  release-latest:
    name: Update Latest Pre-Release
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          name: binaries
          path: release_assets
          merge-multiple: true

      - name: Update 'latest' release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest Build
          prerelease: true
          make_latest: false
          files: release_assets/*

  # Tagged release (v1.2.0, etc.)
  release-tagged:
    name: Publish Tagged Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release_assets
          merge-multiple: true

      - name: Create Tagged Release
        uses: softprops/action-gh-release@v3
        with:
          files: release_assets/*
          generate_release_notes: true

  # Deploy Web Playground to GitHub Pages on main
  deploy-pages:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5